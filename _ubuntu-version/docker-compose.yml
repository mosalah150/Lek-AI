# Local AI stack — Ubuntu 24.04 บน Dell Precision 5820 (RTX 6000 24GB)
# ข้อมูลทั้งหมดอยู่ใต้ /opt/ai บน NVMe · ทุก service กลับมาเองหลังไฟดับ

name: local-ai

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - /opt/ai/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m          # คืน VRAM หลังว่าง 10 นาที เผื่อให้ ComfyUI ใช้ GPU
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2     # LLM หลัก + bge-m3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ไม่เปิดพอร์ตออกนอก Docker: Ollama ไม่มีระบบยืนยันตัวตน
    # Open WebUI และ n8n เรียกผ่าน http://ollama:11434 ภายใน network ของ Docker

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on: [ollama, docling]
    ports:
      - "3000:8080"                    # LAN: http://<IP-5820>:3000  ภายนอก: Tailscale
    volumes:
      - /opt/ai/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_URL=${WEBUI_URL}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # ค่าด้านล่างมีผลแค่ตอนเริ่มครั้งแรก หลังจากนั้นแก้ที่ Admin Settings
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=pending
      - CONTENT_EXTRACTION_ENGINE=docling
      - DOCLING_SERVER_URL=http://docling:5001
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=bge-m3

  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - /opt/ai/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"                    # LAN: http://<IP-5820>:5678
    volumes:
      - /opt/ai/n8n:/home/node/.n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false        # ใช้ผ่าน http ใน LAN ได้
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
